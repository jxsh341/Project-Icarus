[project]
name = "fly-cognition"
version = "0.1.0"
description = "Phase 1 baseline reconstruction, validation, and benchmarking for a connectome-based fly cognition program."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Hermes User" }
]
dependencies = [
  "numpy<2",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "pyarrow>=21,<22",
  "networkx>=3.4,<4",
  "brian2>=2.8,<3",
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
  "neuprint-python>=0.5,<1",
  "joblib>=1.6.0",
  "psutil>=7.2.2",
]


[project.optional-dependencies]
dev = [
  "pytest-cov>=5,<6",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fly"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
